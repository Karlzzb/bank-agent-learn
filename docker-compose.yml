# 自托管 Langfuse 占位:本阶段(E0–E2)不需要任何 Langfuse key。
# E7 接入可观测性时启用:docker compose --profile langfuse up -d
services:
  langfuse-db:
    image: postgres:16
    profiles: ["langfuse"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["langfuse"]
    depends_on:
      - langfuse-db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: changeme
      SALT: changeme

volumes:
  langfuse-db:
